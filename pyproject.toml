[project]
name = "review-agent-lab"
version = "0.1.0"
description = "A measured code-review agent harness, iterated one config at a time against a seeded-bug evalset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.86.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_lab"]
